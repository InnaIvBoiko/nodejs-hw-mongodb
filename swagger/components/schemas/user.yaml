type: object
required:
  - name
  - email
  - password
properties:
  _id:
    description: User's id
    type: string
    example: 6676ebc8d7c1721bb6534fc0
  name:
    description: User's name
    type: string
    example: Inna Boiko
  email:
    description: User's email
    type: string
    example: inna_boiko@libero.it
  password:
    description: User's password
    type: string
    example: password
