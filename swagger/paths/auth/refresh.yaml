tags:
  - Auth
summary: Refresh user session
operationId: refreshUsersSession
description: Refresh user session
security: []
parameters:
  - name: refreshToken
    in: cookie
    required: true
    schema:
      description: Refresh token
      type: string
responses:
  '200':
    description: Successfully refreshed a session!
    content:
      application/json:
        schema:
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  example: k9cWT3hTu0TDcQZXyUN7mdJCah87
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    description: Session not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  description: Error message
                  type: string
                  example: Session not found
