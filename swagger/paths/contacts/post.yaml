tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            description: Contacts's name
            type: string
            example: Mark Boiko
          phoneNumber:
            description: Contacts's phone number
            type: string
            example: '+3801111111'
          email:
            description: Contacts's email
            type: string
            example: mark@verga.com
          isFavourite:
            description: Is Contact favourite? Can be true or false
            type: boolean
            example: true
          contactType:
            description: Contact's type
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: Link to contacts's photo
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
