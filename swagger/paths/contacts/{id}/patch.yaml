tags:
  - Contacts
summary: Update contact
operationId: patchContact
description: Partially update a contact's information
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: 6687c71ada03d4549cb2930a
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contacts's name
            type: string
            example: Mark Boiko
          phoneNumber:
            description: Contacts's phone number
            type: string
            example: '+3801111111'
          email:
            description: Contacts's email
            type: string
            example: mark@verga.com
          isFavourite:
            description: Is Contact favourite? Can be true or false
            type: boolean
            example: true
          contactType:
            description: Contact's type
            type: string
            enum: ['work', 'home', 'personal']
          photo:
            description: Link to contacts's photo
            type: string
            format: binary
responses:
  '200':
    description: Updated a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/patchContact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  description: Error message
                  type: string
                  example: Contact not found
